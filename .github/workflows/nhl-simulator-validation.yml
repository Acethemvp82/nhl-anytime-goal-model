name: NHL simulator validation
on:
  push:
    branches: [main, fix/nhl-simulator-validation]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py test_simulator.py
      - run: python -m unittest -v test_simulator.py
